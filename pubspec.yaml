name: village_charity_association
description: "نظام إدارة جمعية التكافل والتنمية القروية"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  shimmer: ^3.0.0

  # Backend - Supabase
  supabase_flutter: ^2.8.0

  # State Management & Routing ⚠️ مهم جداً
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2  # ⚠️ تأكد من هذا الإصدار

  # Data & Architecture
  equatable: ^2.0.7
  uuid: ^4.6.0
  intl: ^0.20.2
  connectivity_plus: ^6.1.0


  # Charts & Visualizations
  fl_chart: ^0.69.0

  # PDF & Excel Generation
  pdf: ^3.11.1
  printing: ^5.13.2
  excel: ^4.0.6

  # Media & Storage
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  audioplayers: ^6.1.0

  # Environment
  flutter_dotenv: ^5.2.1

  
  # ✅ Sharing (لتصدير التقارير)
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/icons/
    - assets/fonts/
    - .env
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700